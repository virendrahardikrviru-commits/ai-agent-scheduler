name: Trigger AI Agent

on:
  schedule:
    # Runs every day at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to manually test it

jobs:
  ping-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Agent Endpoint
        run: |
          curl -X GET "https://agent-service-721094462352.us-central1.run.app/api/run-agent"
